name: Build PHP runtimes

on:
  workflow_dispatch:
    inputs:
      versions:
        description: Exact PHP patches (comma separated)
        required: true
        default: 8.2.33,8.3.33,8.4.26,8.5.11
      architectures:
        description: Native architectures (arm64,x86_64 or one architecture)
        required: true
        default: arm64,x86_64

permissions:
  contents: read

concurrency:
  group: php-runtime-release-${{ inputs.versions }}-${{ inputs.architectures }}
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.matrix.outputs.versions }}
      runners: ${{ steps.matrix.outputs.runners }}
    steps:
      - id: matrix
        env:
          VERSIONS: ${{ inputs.versions }}
          ARCHITECTURES: ${{ inputs.architectures }}
        run: |
          python3 - <<'PY'
          import json, os, re
          values = [part.strip() for part in os.environ['VERSIONS'].split(',')]
          assert values and len(values) <= 16 and len(set(values)) == len(values)
          assert all(re.fullmatch(r'8\.[2-5]\.\d+', value) for value in values)
          architectures = [part.strip() for part in os.environ['ARCHITECTURES'].split(',')]
          assert architectures and len(set(architectures)) == len(architectures)
          assert all(value in ('arm64', 'x86_64') for value in architectures)
          labels = {'arm64': 'macos-15', 'x86_64': 'macos-15-intel'}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('versions=' + json.dumps(values) + '\n')
              stream.write('runners=' + json.dumps([labels[value] for value in architectures]) + '\n')
          PY

  build:
    needs: matrix
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.matrix.outputs.versions) }}
        runner: ${{ fromJSON(needs.matrix.outputs.runners) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build, verify and package native PHP
        env:
          PHP_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in arm64) arch=arm64 ;; x86_64) arch=x86_64 ;; *) exit 1 ;; esac
          workspace="/private/tmp/grove-php-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          swift test --scratch-path "$workspace/swift"
          swift build --product grove-php-release --scratch-path "$workspace/swift"
          "$workspace/swift/debug/grove-php-release" build --version "$PHP_VERSION" --workspace "$workspace/native" --output "$workspace/payload"
          python3 script/php-release/package.py package --version "$PHP_VERSION" --architecture "$arch" --input "$workspace/payload" --output "$PWD/release-output"
          python3 script/php-release/relink-kit.py --version "$PHP_VERSION" --architecture "$arch" --build "$workspace/native/build" --payload "$workspace/payload" --recipe "$PWD" --output "$PWD/release-output" --verify
          python3 -m unittest discover -s script/php-release -p 'test_*.py'
      - name: Upload verified runtime
        id: artifact
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: php-${{ matrix.version }}-${{ matrix.runner }}
          path: release-output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Retry transient artifact upload
        if: steps.artifact.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: php-${{ matrix.version }}-${{ matrix.runner }}
          path: release-output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: true
      - name: Retain build diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: php-${{ matrix.version }}-${{ matrix.runner }}-logs
          path: /private/tmp/grove-php-${{ github.run_id }}-${{ github.run_attempt }}/native/build/**/logs/*.log
          if-no-files-found: ignore
          retention-days: 14

